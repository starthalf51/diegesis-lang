# 맥베스 합격 기준. 기대값은 원작(texts/macbeth-mit.txt, MIT 판 막.장.줄)과 학계 해석에서 왔다.
# 도구 출력에 맞춰 고치지 않는다. 고칠 때는 원문 근거를 why 와 보고서에 남긴다.
work: macbeth
compile_errors: 0

expected:
  - rule: belief-contradiction
    target: "macbeth.act1/1.3#a10"    # 1.3 의 열째 행위: macbeth says witches: cawdor_in_favour (1.3.75). 1.3.74 "lives" 를 alive(cawdor) 행위로 나눠 한 칸 밀렸다
    waived: true
    why: >-
      코더 문제. 1.2.59-63 에서 맥베스는 코더가 도운 노르웨이군과 맞섰다(이 포팅은 전장에서 반역을 봤다고 쓴다).
      그런데 1.3.74-75 에서 "the thane of Cawdor lives, / A prosperous gentleman" 이라고 말한다.
      앵거스(1.3.117-120)의 "hidden help" 해명 때문에 학계에서 논쟁 중이라 억제하고 사유를 남긴다.

queries:
  - name: banquo-heard-prophecy
    why: >-
      뱅쿼는 1.3.38 에 맥베스와 함께 들어와 셋째 마녀의 "thou shalt be king hereafter"(1.3.52)를 듣는다.
      그래서 1.3.89 "You shall be king" 은 정보 흐름 위반이 아니다. 출처는 1.3 의 예언 비트 하나뿐이다.
    sql: |
      SELECT DISTINCT lint_short(b.entity_id), lint_short(a.actor_id), a.verb, lint_short(a.scene_id), lint_short(a.beat_id)
        FROM believes b JOIN act a ON a.id = b.cause_act
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/banquo' AND b.value
         AND lint_canon($1, b.prop_id) = lint_canon($1, $1 || '/macbeth.cast/king_hereafter')
    rows: [["banquo", "witch3", "hails", "1.3", "1.3#prophecy"]]

  - name: lady-macbeth-learns-by-letter
    why: >-
      맥베스 부인은 1.5.1 에서 편지를 읽고 예언을 처음 안다("hail, king that shalt be!", 1.5.9).
      그 전에는 무대에 없었고, 맥베스는 1.5.59 이후에도 예언을 다시 말하지 않는다. 출처는 reads 하나다.
    sql: |
      SELECT DISTINCT a.verb, lint_short(a.scene_id)
        FROM believes b JOIN act a ON a.id = b.cause_act
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/lady_macbeth' AND b.value
         AND lint_canon($1, b.prop_id) = lint_canon($1, $1 || '/macbeth.cast/king_hereafter')
    rows: [["reads", "1.5"]]

  - name: banquo-kings-paid-off
    why: >-
      1.3.69 "Thou shalt get kings" 의 회수는 4.1 의 왕들의 행렬(4.1.123 지문, 4.1.135-136 "points at them for his")이다.
      unpaid-promise 가 없어야 한다.
    sql: |
      SELECT lint_short(p.setup_id), lint_short(p.scene_id),
             (SELECT count(*) FROM diagnostic d WHERE d.work_id = $1 AND d.rule_id = 'unpaid-promise')
        FROM payoff p WHERE p.work_id = $1 AND p.setup_id = $1 || '/macbeth.act1/banquo_kings'
    rows: [["banquo_kings", "4.1", "0"]]

  - name: duncan-silent-after-death
    why: >-
      덩컨의 마지막 대사는 1.6.34-37 이다. 2.1 이후 덩컨은 말하지 않고 2.2 에서 죽어 있다("I have done the deed", 2.2.18).
      덩컨의 행위 중 죽음보다 확실히 앞서지 않는 것은 없어야 한다.
    sql: |
      SELECT lint_short(a.id) FROM act a
       WHERE a.work_id = $1 AND a.resolved_actor_id = $1 || '/macbeth.cast/duncan'
         AND precedes($1, a.pt, $1 || '/macbeth.cast/duncan.died') <> 'yes'
       ORDER BY 1
    rows: []

  - name: macbeth-first-told-cawdor-by-ross
    why: >-
      맥베스가 holds(thane_of_cawdor, macbeth) 를 들은 출처 중 마녀(oracle)가 아닌 사람의 행위 가운데 가장 이른 것은
      로스의 "He bade me, from him, call thee thane of Cawdor"(1.3.109)다. 뱅쿼의 "To you they have show'd some truth"
      (2.1.25)는 그 뒤다. 비트 이름으로 거르지 않고 시간 순서(precedes)로 가장 이른 출처를 고른다.
    sql: |
      WITH c AS (
        SELECT DISTINCT a.id, a.pt, a.actor_id, a.beat_id
          FROM believes b JOIN act a ON a.id = b.cause_act
         WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/macbeth' AND b.value
           AND b.prop_id = $1 || '/holds(' || $1 || '/macbeth.cast/thane_of_cawdor,' || $1 || '/macbeth.cast/macbeth)'
           AND NOT lint_exempt($1, a.actor_id))
      SELECT lint_short(c.actor_id), lint_short(c.beat_id) FROM c
       WHERE NOT EXISTS (SELECT 1 FROM c d WHERE d.id <> c.id AND precedes($1, c.pt, d.pt) <> 'yes')
    rows: [["ross", "1.3#ross_news"]]

  - name: macbeth-doubts-the-hail
    why: >-
      마녀의 인사 직후 맥베스는 믿지 않는다: "to be king / Stands not within the prospect of belief, / No more than to be
      Cawdor"(1.3.75-77). 두 의심은 로스의 소식(ross_news)보다 앞이고, 왕이 된다는 믿음은 그 소식 뒤에 생긴다
      ("Two truths are told", 1.3.137).
    sql: |
      SELECT b.verb, lint_short(b.prop_id),
             precedes($1, b.at_pt, $1 || '/macbeth.act1/1.3#ross_news'), precedes($1, $1 || '/macbeth.act1/1.3#ross_news', b.at_pt)
        FROM belief b
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/macbeth' AND b.scene_id = $1 || '/macbeth.act1/1.3'
       ORDER BY 1, 2
    rows:
      - ["believes", "king_hereafter", "no", "yes"]
      - ["doubts", "holds(thane_of_cawdor,macbeth)", "yes", "no"]
      - ["doubts", "king_hereafter", "yes", "no"]

  - name: macbeth-hail-belief-withdrawn
    why: >-
      1.3.75-77 의 불신("Stands not within the prospect of belief, / No more than to be Cawdor")은 마녀의 두 인사
      (1.3.51 thane of Cawdor, 1.3.52 king hereafter)에서 들은 믿음을 거둔다(006: doubts 가 앞선 들은 믿음을 거둔다).
      맥베스가 코더 작위를 다시 믿는 것은 로스의 소식(1.3.109)부터다. 셋째 마녀가 뱅쿼에게 한 banquo_line(1.3.69)은
      맥베스도 들었고(1.3.88 "Your children shall be kings") 의심하지 않았다. 글래미스는 이미 아는 사실이다(1.3.73).
    sql: |
      SELECT lint_short(a.actor_id), lint_short(b.prop_id), b.until_pt IS NOT NULL
        FROM believes b JOIN act a ON a.id = b.cause_act
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/macbeth' AND b.value AND a.verb = 'hails'
       ORDER BY 1, 2
    rows:
      - ["witch1", "holds(thane_of_glamis,macbeth)", "false"]
      - ["witch2", "holds(thane_of_cawdor,macbeth)", "true"]
      - ["witch3", "banquo_line", "false"]
      - ["witch3", "king_hereafter", "true"]

  - name: lady-macbeth-hears-the-deed
    why: >-
      맥베스 부인은 살해 현장에 없었다(2.2.5 "He is about it", 2.2.14 "I laid their daggers ready").
      덩컨이 죽었다는 것은 2.2.18 맥베스의 "I have done the deed" 로 안다.
    sql: |
      SELECT lint_short(a.actor_id), a.verb, lint_short(a.scene_id)
        FROM believes b JOIN act a ON a.id = b.cause_act JOIN src s ON s.work_id = a.work_id AND s.id = a.src_id
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/lady_macbeth' AND b.value
         AND b.prop_id = $1 || '/not alive(' || $1 || '/macbeth.cast/duncan)'
       ORDER BY s.line LIMIT 1
    rows: [["macbeth", "tells", "2.2"]]

  - name: lady-macbeth-told-duncan-comes
    why: >-
      덩컨의 방문은 맥베스 부인에게 두 번 전해진다: 전령(1.5.32 "The king comes here to-night")과
      맥베스(1.5.65 "Duncan comes here to-night"). 전령은 먼저 달려온 동료에게서 들었다(1.5.37).
    sql: |
      SELECT lint_short(a.actor_id), lint_short(a.scene_id)
        FROM believes b JOIN act a ON a.id = b.cause_act JOIN src s ON s.work_id = a.work_id AND s.id = a.src_id
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/lady_macbeth' AND b.value
         AND b.prop_id = $1 || '/macbeth.cast/duncan_comes'
       ORDER BY s.file, s.line
    rows: [["messenger", "1.5"], ["macbeth", "1.5"]]

  - name: malcolm-heard-of-execution
    why: >-
      맬컴은 코더의 처형을 직접 보지 않았다: "I have spoke / With one that saw him die"(1.4.4-5).
      그래서 1.4.9 "he died" 의 출처는 무대 밖 처형 사건의 목격자다.
    sql: |
      SELECT lint_short(a.actor_id), lint_short(a.scene_id), a.verb
        FROM believes b JOIN act a ON a.id = b.cause_act
       WHERE b.work_id = $1 AND b.entity_id = $1 || '/macbeth.cast/malcolm' AND b.value
         AND b.prop_id = $1 || '/not alive(' || $1 || '/macbeth.cast/cawdor)'
    rows: [["witness", "cawdor_execution", "tells"]]

  - name: witches-hail-is-true
    why: >-
      둘째 마녀의 "hail to thee, thane of Cawdor!"(1.3.51)는 그 순간 이미 참이다. 덩컨이 1.2.72-74 에서 작위를
      맥베스에게 주었고 1.3 은 1.2 뒤다. 맥베스는 1.3.109 에서야 안다(그래서 1.3.74 의 말은 거짓 믿음이다).
      작위 선언(held … from @1.2.decree)과 장면 순서를 시간 풀이가 합쳐야 나오는 값이다.
    sql: |
      SELECT lint_short(s.entity_id) FROM role_span s, act a
       WHERE s.work_id = $1 AND s.role_id = $1 || '/macbeth.cast/thane_of_cawdor'
         AND a.id = $1 || '/macbeth.act1/1.3#a5' AND a.verb = 'hails'
         AND (s.from_pt IS NULL OR precedes($1, s.from_pt, a.pt) = 'yes')
         AND (s.until_pt IS NULL OR (precedes($1, a.pt, s.until_pt) = 'yes' AND precedes($1, s.until_pt, a.pt) <> 'yes'))
    rows: [["macbeth"]]

mutation_min_rate: 0.8
mutation_min_rate_wo_move_before: 0.7   # ADR-014: move-before 를 뺀 나머지 연산자의 탐지율 기준

# sil render-check 가 모든 문체 백엔드로 렌더해 내용 동일·어투 상이를 판정하는 장면(ADR-012). 대사가 많은 중간 크기 장면.
render_scene: "1.3"
