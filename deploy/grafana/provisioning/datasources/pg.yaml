apiVersion: 1
datasources:
  - name: Diegesis PG
    uid: diegesis-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: pg:5432 # the pg service on the compose internal network (not host port 55432)
    user: sl_ro
    isDefault: true
    jsonData:
      database: sl
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $SL_RO_PASSWORD # Grafana substitutes it from the environment variable
