services:
  pg:
    build: ./postgres
    image: ghcr.io/starthalf51/diegesis-pg:age1.8.0-pgvector0.8.7
    pull_policy: missing
    environment:
      POSTGRES_USER: sl
      POSTGRES_PASSWORD: sl
      POSTGRES_DB: sl
    ports: ["127.0.0.1:55432:5432"] # takes effect when the pg container is recreated (data is in a volume)
    volumes: ["sl_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sl -d sl"]
      interval: 3s
      retries: 20

  # Passwords are read from deploy/.env (see .env.example). pg starts even without it; ro-init and grafana print a notice and stop if they are empty.
  # Sets the login password on sl_ro (created NOLOGIN by 015_readonly_role.sql). The password is the environment variable SL_RO_PASSWORD.
  # The role must exist first, so use this after running `dieg db migrate` once. An already running pg is not recreated.
  ro-init:
    image: ghcr.io/starthalf51/diegesis-pg:age1.8.0-pgvector0.8.7
    depends_on:
      pg: {condition: service_healthy}
    restart: "no"
    environment:
      PGPASSWORD: sl
      SL_RO_PASSWORD: ${SL_RO_PASSWORD:-}
    entrypoint: ["sh", "-c", "[ -n \"$$SL_RO_PASSWORD\" ] || { echo 'SL_RO_PASSWORD is empty: copy deploy/.env.example to deploy/.env and set it' >&2; exit 1; }; echo \"ALTER ROLE sl_ro LOGIN PASSWORD :'pw'\" | psql -v ON_ERROR_STOP=1 -h pg -U sl -d sl -v pw=\"$$SL_RO_PASSWORD\""]

  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      ro-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      SL_RO_PASSWORD: ${SL_RO_PASSWORD:-}
    entrypoint: ["sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] && [ -n \"$$SL_RO_PASSWORD\" ] || { echo 'GF_ADMIN_PASSWORD or SL_RO_PASSWORD is empty: copy deploy/.env.example to deploy/.env and set both' >&2; exit 1; }; exec /run.sh"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  sl_pgdata:
