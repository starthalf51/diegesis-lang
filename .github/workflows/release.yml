name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" -o "dieg_${TAG#v}_${GOOS}_${GOARCH}${ext}" ./cmd/dieg
      - uses: actions/upload-artifact@v4
        with:
          name: dieg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dieg_*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dieg-*
          merge-multiple: true
      - run: sha256sum dieg_* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dieg_*
            checksums.txt
